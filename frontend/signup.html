<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up — InsightFlow</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/design-system.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/utilities.css">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/forms.css">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/auth.css">
  <script src="js/theme.js"></script>
</head>
<body style="background:var(--black);display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px">
  
  <div class="auth-card">
    <div class="auth-logo">
      <span style="font-family:var(--ff);font-size:22px;font-weight:700;color:var(--white)">INSIGHTFLOW</span>
    </div>
    
    <h2 class="auth-title">Create Account</h2>
    <p class="auth-sub">Start building AI-powered business intelligence dashboards</p>

    <div id="auth-signup-alert" style="display:none;padding:10px 14px;border-radius:6px;font-family:var(--fm);font-size:12.5px;margin-bottom:16px"></div>

    <form onsubmit="handleEmailSignUp(event)">
      <div class="lg-field">
        <label for="signup-name">Full Name</label>
        <input type="text" id="signup-name" placeholder="John Doe" required>
      </div>

      <div class="lg-field">
        <label for="signup-email">Email Address</label>
        <input type="email" id="signup-email" placeholder="name@company.com" required>
      </div>

      <div class="lg-field">
        <label for="signup-password">Password</label>
        <input type="password" id="signup-password" placeholder="At least 6 characters" required minlength="6">
      </div>

      <div class="lg-field">
        <label for="signup-confirm-password">Confirm Password</label>
        <input type="password" id="signup-confirm-password" placeholder="Repeat password" required minlength="6">
      </div>

      <button type="submit" id="signup-btn" class="lg-submit">Create Account</button>
    </form>

    <button type="button" class="lg-google" onclick="loginWithGoogle()">
      <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
      Sign up with Google
    </button>

    <div class="lg-signup">
      Already have an account? <a href="login.html">Sign in</a>
    </div>
  </div>

  <script src="js/utils.js"></script>
  <script src="js/api.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="js/firebase.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
