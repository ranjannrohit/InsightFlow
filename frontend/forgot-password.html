<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — InsightFlow</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/forms.css">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body style="background:var(--black);display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px">
  
  <div class="auth-card">
    <div class="auth-logo">
      <span style="font-family:var(--ff);font-size:22px;font-weight:700;color:var(--white)">INSIGHTFLOW</span>
    </div>
    
    <h2 class="auth-title">Reset Password</h2>
    <p class="auth-sub">Enter your email address and we'll send you instructions to reset your password</p>

    <div id="auth-forgot-alert" style="display:none;padding:10px 14px;border-radius:6px;font-family:var(--fm);font-size:12.5px;margin-bottom:16px"></div>

    <form onsubmit="handleForgotPassword(event)">
      <div class="lg-field">
        <label for="forgot-email">Account Email</label>
        <input type="email" id="forgot-email" placeholder="name@company.com" required>
      </div>

      <button type="submit" id="forgot-btn" class="lg-submit">Send Reset Link</button>
    </form>

    <div class="lg-signup">
      Remembered your password? <a href="login.html">Return to Sign In</a>
    </div>
  </div>

  <script src="js/utils.js"></script>
  <script src="js/api.js"></script>
  <script src="js/firebase.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
